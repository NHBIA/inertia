name: CI

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup +nightly target add thumbv8m.main-none-eabihf
      - name: Build
        run: cargo +nightly build --release --artifact-dir=out -Z unstable-options
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: inertia
          path: out

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
