[package]
name = "inertia-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.6"
cortex-m-rt = "0.7.0"
defmt = "0.3"
defmt-rtt = "0.4"
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "defmt", "executor-thread"] }
embassy-rp = { version = "0.3.1", features = ["binary-info", "critical-section-impl", "defmt", "rp235xa", "time-driver"] }
embassy-time = "0.4.0"
panic-probe = { version = "0.3" }
smart-leds = "0.4.0"
