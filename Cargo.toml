[package]
name = "inertia-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.6"
cortex-m-rt = "0.7.0"
cyw43 = { version = "0.3.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.3.0", features = ["defmt"] }
defmt = "0.3"
defmt-rtt = "0.4"
embassy-executor = { version = "0.7.0", features = ["task-arena-size-98304", "arch-cortex-m", "defmt", "executor-interrupt", "executor-thread"] }
embassy-net = { version = "0.6.0", features = ["defmt", "dhcpv4", "tcp", "udp"] }
embassy-rp = { version = "0.3.1", features = ["binary-info", "critical-section-impl", "defmt", "rp235xa", "time-driver"] }
embassy-time = "0.4.0"
panic-probe = { version = "0.3" }
smart-leds = "0.4.0"
static_cell = "2.1.0"
